# ─────────────────────────────────────────────────────────────────────────────
# OPEN-ISP — docker compose (produksi / test)
#
# Persiapan pertama (sekali):
#   mkdir -p docker-data/database docker-data/backups docker-data/logs docker-data/uploads docker-data/baileys
#   echo '{"server_port":3001,"cookie_secure":false}' > docker-data/settings.json
#
# Jalankan:
#   docker compose up -d --build
#   docker compose logs -f
#
# Catatan:
# - Semua DATA (DB, settings, upload, sesi WhatsApp) tersimpan di ./docker-data
#   → aman saat container di-update. Backup cukup folder docker-data.
# - Ganti cookie_secure ke true bila diakses via HTTPS/reverse-proxy TLS.
# ─────────────────────────────────────────────────────────────────────────────
services:
  open-isp:
    build: .
    image: open-isp:0.5
    container_name: open-isp
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "7547:7547"   # TR-069 (ACS) para las ONU: solo POST /acs con usuario y clave
    environment:
      - NODE_ENV=production
      - TZ=America/Asuncion
    volumes:
      - ./docker-data/settings.json:/app/settings.json
      - ./docker-data/database:/app/database
      - ./docker-data/backups:/app/backups          # respaldos: fuera del contenedor (antes se perdían en cada actualización)
      - ./docker-data/logs:/app/logs
      - ./docker-data/uploads:/app/public/uploads
      - ./docker-data/baileys:/app/auth_info_baileys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/version.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # WhatsApp (GoWA). Sin puertos publicados: solo Open-ISP lo alcanza por la red interna
  # (http://gowa:3000). Usuario/contraseña en docker-data/gowa.env (APP_BASIC_AUTH=usuario:clave).
  # Versión fija: actualizar a mano después de probar.
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.5.0
    container_name: gowa
    restart: unless-stopped
    command: rest
    env_file:
      - ./docker-data/gowa.env
    environment:
      - TZ=America/Asuncion
    volumes:
      - ./docker-data/gowa:/app/storages

